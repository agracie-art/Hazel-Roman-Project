<body>
<div id="title"><img id="ticon" src="icons/icon-192.png" alt="">
<h1>STEAL A ROMAN</h1><div id="sub">Grab an egg. Hatch a Roman.</div>
<div id="ldbar"><div id="bar"></div></div><div id="ldg">Loading...</div>
<button class="btn" id="play">PLAY</button>
<div id="credit">A game brought to you by Hazel Gracie-Herst</div>
<div id="a2hs">Tip: for full screen, tap Share, then Add to Home Screen</div></div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="flash"></div>
<div id="banner"></div>
<div id="upg"></div>
<div id="unlock" popover="manual"></div>
<div id="adbox"><video id="advid" playsinline webkit-playsinline preload="none"></video><button class="btn" id="adx" aria-label="Close ad">✕</button><div id="adbar"><span class="pill" id="adtxt"></span></div></div>
<div id="hudL"><button class="btn" id="facts">Facts</button><div class="pill" id="speed">Speed 120</div><div class="pill" id="gain"></div><div class="pill" id="eggs">Eggs 50</div><button class="btn" id="snd">♪ On</button></div>
<div id="hudR"><div class="pill" id="money">$0</div><div class="pill" id="inc"></div><button class="btn" id="shop">Shop</button><button class="btn" id="ad"><span class="ico"></span><span id="adlbl">WATCH AD +$50</span></button></div>
<div id="zoom"><button class="btn" id="zin">+</button><button class="btn" id="zout">−</button></div>
<div class="pill" id="toast"></div>

<div id="stick"><div id="base"><div id="thumb"></div></div></div>
<button class="btn" id="open">Open egg</button>
<button class="btn" id="jump">JUMP</button>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="rotate" class="on"><div>Turn your phone sideways to play</div><button class="btn" id="rotOk">Play anyway</button></div>

<script src="lib/three.min.js"></script>
<script>
const RAR=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Secret'];
const ECOL=[0x9a9a9a,0x4caf50,0x3d8bd9,0x9c4fd0,0xe8a020,0xd23a52,0x222222];
const CSS=['#8a8a8a','#3f8a4a','#2f6fb5','#8a3fb5','#c9861a','#c2364a','#111'];
const PRICE=[1,3,8,20,50,120,300];
const REQ=[150,220,350,600,1000,1600,2500],req=t=>REQ[t];
const ROMANS=[
["Peasant",0,"Britain used to be called Britannia."],
["Slave",0,"Most slaves were people from places Rome had invaded."],
["Soldier",1,"If you were a strong person from a country Rome had invaded, you had to join the Roman army."],
["Gladiator",1,"The gladiators used so many lions that there are no more lions in North Africa today!"],
["Tax Collector",2,"When Rome got bigger, the rich got richer but the poor Romans got poorer."],
["Celt",2,"Some Celts painted their faces with berries."],
["Lion Tamer",3,"Gladiators fought lions to become Roman citizens from the emperor."],
["Governor",3,"A governor was the best job you could get apart from the emperor."],
["Julius Caesar",4,"Julius Caesar was the first emperor to have his face put on coins."],
["Emperor Nero",4,"Emperor Nero nearly lost Britain when he was emperor."],
["Boudicca",5,"When Prasutagus died, the Romans kicked Boudicca out of her house."],
["Prasutagus",5,"He was allies with the Romans, but when he died they kicked Boudicca out of her house."],
["Jupiter",6,"He was the most powerful god."],
["Juno",6,"She was Jupiter's wife and she was the most powerful goddess."]];
const $=id=>document.getElementById(id);
const st={money:0,speed:120,found:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem('reg-save')||'{}'))}catch(e){}
let noSave=false;
const save=()=>{if(noSave)return;st.base=baseEggs.map(e=>({t:e.t,i:BSLOT.indexOf(e.q)}));try{localStorage.setItem('reg-save',JSON.stringify(st))}catch(e){}};
st.baseLv=st.baseLv||0;st.speedBuys=st.speedBuys||0;st.vip=st.vip||0;
const BASE_SPEED=120,CAPS=[6,9,12,15,18],BASE_COST=[150,500,1500,4000],VIP_COST=1000,SPEED_STEP=20;
const cap=()=>CAPS[st.baseLv],speedCost=()=>50*(st.speedBuys+1);
setInterval(save,2000);addEventListener('pagehide',save);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));

// ---------- scene ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ecae6);
const camera=new THREE.PerspectiveCamera(45,16/9,.1,200);
function resize(){const h=190,w=Math.round(h*innerWidth/innerHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0xffffff,.5));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(10,20,8);scene.add(sun);
const M=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,specular:0,shininess:0});
function box(w,h,d,c,x,y,z,par){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(par||scene).add(m);return m}
const LBL=[];
function label(t,x,y,z){const el=document.createElement('div');el.className='lbl';el.textContent=t;$('labels').appendChild(el);
 const o={position:new THREE.Vector3(x,y,z),scale:{set(){}},el};LBL.push(o);return o}
const _lv=new THREE.Vector3();
const POPS=[];let popN=0,lastLbl=performance.now();
function pop(t,big,px,pz,py,cls){const el=document.createElement('div');el.className='pop'+(big?' big':'')+(cls?' '+cls:'');el.textContent=t;$('labels').appendChild(el);popN++;
 POPS.push({el,x:(px===undefined?p.x:px)+(Math.random()-.5)*(big?.4:1.6),y:py===undefined?(big?4.6:3.4):py,z:(pz===undefined?p.z:pz)+.3,age:0,big})}
function updateLabels(){const W=innerWidth,H=innerHeight,now=performance.now(),dt=Math.min(.1,(now-lastLbl)/1000);lastLbl=now;
 for(let i=POPS.length-1;i>=0;i--){const o=POPS[i];o.age+=dt;if(o.age>(o.big?1.3:.9)){o.el.remove();POPS.splice(i,1);continue}
  _lv.set(o.x,o.y+o.age*2.4,o.z).project(camera);o.el.style.opacity=Math.max(0,1-o.age/(o.big?1.3:.9)*.9);
  o.el.style.transform='translate('+Math.round((_lv.x+1)/2*W)+'px,'+Math.round((1-_lv.y)/2*H)+'px) translate(-50%,-100%)'}
for(const o of LBL){if(o.hide){o.el.style.display='none';continue}_lv.copy(o.position).project(camera);
 if(_lv.z>1||Math.abs(_lv.x)>1.15||Math.abs(_lv.y)>1.15){o.el.style.display='none';continue}
 o.el.style.display='block';o.el.style.transform='translate('+Math.round((_lv.x+1)/2*W)+'px,'+Math.round((1-_lv.y)/2*H)+'px) translate(-50%,-100%)'}}

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,100),M(0xd8c79a));ground.rotation.x=-Math.PI/2;scene.add(ground);
const pave=new THREE.Mesh(new THREE.PlaneGeometry(26,24),M(0xcfc8ba));pave.rotation.x=-Math.PI/2;pave.position.set(-24,.02,0);scene.add(pave);
const ACX=42,AR=30;
const floor=new THREE.Mesh(new THREE.CircleGeometry(AR,48),M(0xc9aa6c));floor.rotation.x=-Math.PI/2;floor.position.set(ACX,.03,0);scene.add(floor);

// temple (your base)
const BX=-24;
box(16,1,8,0xe8e2d4,BX,.5,-4);
[-6,-3.6,-1.2,1.2,3.6,6].forEach(dx=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,4,6),M(0xf4f0e6));c.position.set(BX+dx,3,-1);scene.add(c)});
box(9,4,1,0xd8d0be,BX,3,-7.2);
box(15,.4,.5,0xf4f0e6,BX,5.1,-1);
box(1.4,2.4,.3,0x5b1e4a,BX,2.2,-6.6);
const baseLabel=label('Your base',BX,7.4,-3.5);
box(14.6,.08,2.6,0xe0c878,BX,.05,3.5);
label('Tap an egg to hatch it',BX,3.6,3.5);

// treadmill
const TX=-14,TZ=6;
box(2.6,.35,4,0x333333,TX,.2,TZ);
const belt=[];for(let i=0;i<5;i++)belt.push(box(2.2,.1,.3,0xffd34d,TX,.42,TZ-1.6+i*.8));
label('Treadmill',TX,3.2,TZ);
const baseExtras=[];
