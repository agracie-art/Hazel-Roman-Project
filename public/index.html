<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Steal a Roman</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8ecae6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steal a Roman">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:#fbf6ea;--ink:#2a2230;--gold:#b8921e;--purple:#5b1e4a;--muted:#6d6474;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#241e2b;--ink:#f0ebf3;--gold:#e0b84a;--purple:#d79bc4;--muted:#a79db0}}
:root[data-theme="dark"]{--panel:#241e2b;--ink:#f0ebf3;--gold:#e0b84a;--purple:#d79bc4;--muted:#a79db0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#8ecae6;overflow:hidden;font-family:"Courier New",monospace;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.pill,.btn{background:var(--panel);color:var(--ink);border:3px solid #2a2230;padding:6px 10px;font:700 15px "Courier New",monospace;box-shadow:3px 3px 0 #2a2230}
.btn{cursor:pointer}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2a2230}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hudL{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
#hudR{display:flex;flex-direction:column;gap:8px;align-items:flex-end;position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px))}
#labels{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.lbl{position:absolute;left:0;top:0;display:none;background:rgba(0,0,0,.65);color:#fff;font:700 13px "Courier New",monospace;padding:2px 7px;white-space:nowrap;text-rendering:geometricPrecision}
#title{position:fixed;inset:0;z-index:20;background:#8ecae6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vh,14px);text-align:center;padding:12px;color:var(--ink)}
#ticon{width:clamp(64px,26vh,150px);height:auto;image-rendering:pixelated;border:4px solid #2a2230;box-shadow:5px 5px 0 #2a2230}
#title h1{margin:0;font-size:clamp(28px,11vh,72px);letter-spacing:2px;color:#fbf6ea;text-shadow:4px 4px 0 #2a2230,-2px -2px 0 #2a2230,2px -2px 0 #2a2230,-2px 2px 0 #2a2230}
#sub{font-weight:700;font-size:clamp(13px,3.6vh,20px);color:#2a2230}
#ldbar{width:min(300px,60vw);height:18px;border:3px solid #2a2230;background:#fbf6ea}
#bar{height:100%;width:0;background:#b8921e;animation:load 1.4s ease-out forwards}
@keyframes load{to{width:85%}}
#ldg{font-weight:700;font-size:14px;color:#2a2230}
#play{display:none;font-size:clamp(18px,5vh,28px);padding:10px 36px;animation:pulse .6s infinite alternate}
#credit{font-weight:700;font-size:clamp(12px,3vh,17px);color:#2a2230;background:#fbf6ea;border:3px solid #2a2230;padding:4px 10px}
#a2hs{display:none;font-size:13px;font-weight:700;color:#2a2230;max-width:80vw}
#labels .pop{position:absolute;left:0;top:0;font:900 20px "Courier New",monospace;color:#7cff8a;white-space:nowrap;text-shadow:2px 2px 0 #1b4a24,-2px -2px 0 #1b4a24,2px -2px 0 #1b4a24,-2px 2px 0 #1b4a24}
#labels .pop.big{color:#ffd34d;font-size:28px;text-shadow:2px 2px 0 #5a3a00,-2px -2px 0 #5a3a00,2px -2px 0 #5a3a00,-2px 2px 0 #5a3a00}
#gain{display:none;background:#2e9e45;color:#fff}
#speed.up{background:#2e9e45;color:#fff;animation:pulse .35s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
#edgeR,#edgeL{position:fixed;display:none;pointer-events:none;animation:pulse .6s infinite alternate}#edgeR{right:8px}#edgeL{left:8px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;animation:pulse .6s infinite alternate;pointer-events:none}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:44vw;text-align:center;font-size:14px;display:none}
#jump{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;font-size:16px;padding:0}
#zin,#zout{width:46px;font-size:22px;padding:2px 0}
#open{position:fixed;right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:none;font-size:18px;padding:12px 18px}
#stick{position:fixed;left:0;bottom:0;width:45vw;height:60vh}
#base{position:absolute;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:3px solid #2a2230;background:rgba(251,246,234,.35)}
#thumb{position:absolute;left:28px;top:28px;width:40px;height:40px;border-radius:50%;background:var(--panel);border:3px solid #2a2230}
dialog{border:3px solid #2a2230;background:var(--panel);color:var(--ink);width:min(440px,92vw);max-height:84vh;overflow:auto;padding:14px;box-shadow:5px 5px 0 #2a2230;font-family:"Courier New",monospace}
dialog::backdrop{background:rgba(0,0,0,.55)}
h3{margin:0 0 8px;font-size:20px;color:var(--purple)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:8px 0;border-top:2px dashed var(--muted)}
.fact{font-size:13px;color:var(--muted);margin-top:2px}
.pt{width:52px;height:52px;image-rendering:pixelated;border:3px solid #2a2230;flex:none;background:#fff}
.tag{font-size:12px;font-weight:700;color:#fff;padding:2px 8px;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
#rotate{position:fixed;inset:0;background:rgba(20,15,25,.92);color:#fff;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9;font-size:18px}
@media (orientation:portrait){#rotate.on{display:flex}}
</style>
</head>
<body>
<div id="title"><img id="ticon" src="icons/icon-192.png" alt="">
<h1>STEAL A ROMAN</h1><div id="sub">Grab an egg. Hatch a Roman.</div>
<div id="ldbar"><div id="bar"></div></div><div id="ldg">Loading...</div>
<button class="btn" id="play">PLAY</button>
<div id="credit">A game brought to you by Hazel Gracie-Herst</div>
<div id="a2hs">Tip: for full screen, tap Share, then Add to Home Screen</div></div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hudL"><div class="pill" id="money">$0</div><div class="pill" id="speed">Speed 120</div><div class="pill" id="gain"></div><div class="pill" id="eggs">Eggs 68</div></div>
<div id="hudR"><button class="btn" id="facts">Facts</button><button class="btn" id="zin">+</button><button class="btn" id="zout">−</button></div>
<div class="pill" id="toast"></div>
<div class="pill" id="hint"></div>
<div class="pill edge" id="edgeR"></div><div class="pill edge" id="edgeL"></div>
<div id="stick"><div id="base"><div id="thumb"></div></div></div>
<button class="btn" id="open">Open egg</button>
<button class="btn" id="jump">JUMP</button>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="rotate" class="on"><div>Turn your phone sideways to play</div><button class="btn" id="rotOk">Play anyway</button></div>

<script src="lib/three.min.js"></script>
<script>
const RAR=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Secret'];
const ECOL=[0x9a9a9a,0x4caf50,0x3d8bd9,0x9c4fd0,0xe8a020,0xd23a52,0x222222];
const CSS=['#8a8a8a','#3f8a4a','#2f6fb5','#8a3fb5','#c9861a','#c2364a','#111'];
const PRICE=[1,3,8,20,50,120,300];
const req=t=>150+t*50;
const ROMANS=[
["Peasant",0,"Britain used to be called Britannia."],
["Slave",0,"Most slaves were people from places Rome had invaded."],
["Soldier",1,"If you were a strong person from a country Rome had invaded, you had to join the Roman army."],
["Gladiator",1,"The gladiators used so many lions that there are no more lions in North Africa today!"],
["Tax Collector",2,"When Rome got bigger, the rich got richer but the poor Romans got poorer."],
["Celt",2,"Some Celts painted their faces with berries."],
["Lion Tamer",3,"Gladiators fought lions to become Roman citizens from the emperor."],
["Governor",3,"A governor was the best job you could get apart from the emperor."],
["Julius Caesar",4,"Julius Caesar was the first emperor to have his face put on coins."],
["Emperor Nero",4,"Emperor Nero nearly lost Britain when he was emperor."],
["Boudicca",5,"When Prasutagus died, the Romans kicked Boudicca out of her house."],
["Prasutagus",5,"He was allies with the Romans, but when he died they kicked Boudicca out of her house."],
["Jupiter",6,"He was the most powerful god."],
["Juno",6,"She was Jupiter's wife and she was the most powerful goddess."]];
const $=id=>document.getElementById(id);
const st={money:0,speed:120,found:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem('reg-save')||'{}'))}catch(e){}
const save=()=>{st.base=baseEggs.map(e=>({t:e.t,i:BSLOT.indexOf(e.q)}));try{localStorage.setItem('reg-save',JSON.stringify(st))}catch(e){}};
setInterval(save,2000);addEventListener('pagehide',save);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));

// ---------- scene ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ecae6);
const camera=new THREE.PerspectiveCamera(45,16/9,.1,200);
function resize(){const h=190,w=Math.round(h*innerWidth/innerHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0xffffff,.5));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(10,20,8);scene.add(sun);
const M=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,specular:0,shininess:0});
function box(w,h,d,c,x,y,z,par){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(par||scene).add(m);return m}
const LBL=[];
function label(t,x,y,z){const el=document.createElement('div');el.className='lbl';el.textContent=t;$('labels').appendChild(el);
 const o={position:new THREE.Vector3(x,y,z),scale:{set(){}},el};LBL.push(o);return o}
const _lv=new THREE.Vector3();
const POPS=[];let popN=0,lastLbl=performance.now();
function pop(t,big){const el=document.createElement('div');el.className='pop'+(big?' big':'');el.textContent=t;$('labels').appendChild(el);popN++;
 POPS.push({el,x:p.x+(Math.random()-.5)*(big?.4:1.6),y:(big?4.6:3.4),z:p.z+.3,age:0,big})}
function updateLabels(){const W=innerWidth,H=innerHeight,now=performance.now(),dt=Math.min(.1,(now-lastLbl)/1000);lastLbl=now;
 for(let i=POPS.length-1;i>=0;i--){const o=POPS[i];o.age+=dt;if(o.age>(o.big?1.3:.9)){o.el.remove();POPS.splice(i,1);continue}
  _lv.set(o.x,o.y+o.age*2.4,o.z).project(camera);o.el.style.opacity=Math.max(0,1-o.age/(o.big?1.3:.9)*.9);
  o.el.style.transform='translate('+Math.round((_lv.x+1)/2*W)+'px,'+Math.round((1-_lv.y)/2*H)+'px) translate(-50%,-100%)'}
for(const o of LBL){_lv.copy(o.position).project(camera);
 if(_lv.z>1||Math.abs(_lv.x)>1.15||Math.abs(_lv.y)>1.15){o.el.style.display='none';continue}
 o.el.style.display='block';o.el.style.transform='translate('+Math.round((_lv.x+1)/2*W)+'px,'+Math.round((1-_lv.y)/2*H)+'px) translate(-50%,-100%)'}}

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,100),M(0xd8c79a));ground.rotation.x=-Math.PI/2;scene.add(ground);
const pave=new THREE.Mesh(new THREE.PlaneGeometry(26,24),M(0xcfc8ba));pave.rotation.x=-Math.PI/2;pave.position.set(-24,.02,0);scene.add(pave);
const ACX=42,AR=30;
const floor=new THREE.Mesh(new THREE.CircleGeometry(AR,48),M(0xc9aa6c));floor.rotation.x=-Math.PI/2;floor.position.set(ACX,.03,0);scene.add(floor);

// temple (your base)
const BX=-24;
box(16,1,8,0xe8e2d4,BX,.5,-4);
[-6,-3.6,-1.2,1.2,3.6,6].forEach(dx=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,4,6),M(0xf4f0e6));c.position.set(BX+dx,3,-1);scene.add(c)});
box(9,4,1,0xd8d0be,BX,3,-7.2);
box(15,.4,.5,0xf4f0e6,BX,5.1,-1);
box(1.4,2.4,.3,0x5b1e4a,BX,2.2,-6.6);
label('Your base',BX,7.4,-3.5);
box(14.6,.08,2.6,0xe0c878,BX,.05,3.5);
label('Hatch eggs here',BX,3.4,3.5);

// treadmill
const TX=-14,TZ=6;
box(2.6,.35,4,0x333333,TX,.2,TZ);
const belt=[];for(let i=0;i<5;i++)belt.push(box(2.2,.1,.3,0xffd34d,TX,.42,TZ-1.6+i*.8));
label('Treadmill',TX,3.2,TZ);

// colosseum walls
const walls=[];
for(let i=0;i<44;i++){const a=i*Math.PI*2/44;if(Math.abs(a-Math.PI)<.37)continue;
 const x=ACX+AR*Math.cos(a),z=AR*Math.sin(a);
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=-a+Math.PI/2;scene.add(g);
 box(4.3,3.2,1.8,0xdccda4,0,1.6,0,g);box(4.3,2.2,1.8,0xc7b78a,0,4.3,0,g);box(1.2,1.6,.2,0x5a4a30,0,1.3,.95,g);box(1.2,1.2,.2,0x5a4a30,0,4.2,.95,g);
 walls.push({x,z})}
label('Colosseum',ACX-AR,7.5,0);
label('EGGS >>',ACX-AR-3,4.5,0);
for(let x=-10;x<=ACX-AR-1;x+=2.5)box(1.2,.06,.5,0xe0c878,x,.06,3);

// player
function limb(par,w,h,d,c,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);box(w,h,d,c,0,-h/2,0,g);par.add(g);return g}
function person(o){const g=new THREE.Group(),skin=o.skin;
 box(.9,1.1,.55,o.tunic,0,1.1,0,g);box(.65,.65,.65,skin,0,2.05,0,g);
 box(.1,.1,.05,0x222222,-.15,2.1,.33,g);box(.1,.1,.05,0x222222,.15,2.1,.33,g);
 const l=limb(g,.28,.6,.28,o.legs||skin,-.2,.6,0),r=limb(g,.28,.6,.28,o.legs||skin,.2,.6,0);
 if(o.toga){[l,r].forEach(q=>box(.34,.12,.42,0x6b4a2a,0,-.56,.05,q));
  box(1.0,.55,.62,0xf4f0e6,0,.78,0,g);box(.55,1.2,.66,0xe9e3d3,-.25,1.1,0,g);box(.12,1.15,.68,0x6b2b8a,.15,1.1,0,g);box(.96,.14,.64,0xb8921e,0,.78,0,g)}
 const al=limb(g,.2,.7,.2,o.toga?0xe9e3d3:skin,-.6,1.6,0),ar=limb(g,.2,.7,.2,skin,.6,1.6,0);
 if(o.hair){box(.75,.75,.25,o.hair,0,1.9,-.3,g);box(.7,.2,.7,o.hair,0,2.45,0,g)}
 if(o.toga)box(.74,.12,.74,0x4caf50,0,2.5,0,g);
 if(o.helmet){box(.8,.3,.8,0xb88a2a,0,2.5,0,g);box(.15,.4,.9,0xc2364a,0,2.8,0,g)}
 if(o.legion){const S=0xb8bcc4,R=0xb02a2a;
  [1.45,1.2,.95].forEach(y=>box(1.02,.2,.64,S,0,y,0,g));[-.55,.55].forEach(x=>box(.4,.2,.7,S,x,1.68,0,g));
  box(1.0,.4,.62,R,0,.62,0,g);box(1.02,.12,.64,0x8a5a2a,0,.85,0,g);
  box(.95,1.3,.1,R,0,1.1,-.36,g);
  [l,r].forEach(q=>box(.32,.32,.32,S,0,-.44,.02,q));
  box(.78,.34,.78,S,0,2.48,0,g);box(.8,.32,.2,S,0,2.2,-.42,g);[-.4,.4].forEach(x=>box(.12,.42,.5,S,x,2.12,.1,g));
  box(1.0,.38,.22,0xc2364a,0,2.82,0,g)}
 g.userData={l,r,al,ar};scene.add(g);return g}
const player=person({skin:0xf0c8a0,tunic:0xf4f0e6,hair:0x5a3a1a,toga:1});
const sol=person({skin:0xe0b088,tunic:0xb02a2a,legion:1});sol.scale.setScalar(1.7);
box(.2,1.7,1.05,0xb8921e,.78,1.15,.25,sol);box(.24,1.5,.85,0xb02a2a,.8,1.15,.25,sol);box(.28,.35,.35,0xffd34d,.84,1.15,.25,sol);
const sword=box(.1,.1,1.4,0xd8d8d8,-.75,1.1,.7,sol);
const solLabel=label('Centurion',0,0,0);

// eggs
function makeEgg(t,small){const g=new THREE.Group();const k=(.65+.08*t)*(small?.7:1);
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),M(ECOL[t]));m.scale.set(k,k*1.35,k);m.position.y=k*1.35;g.add(m);
 box(.3*k+.15,.3*k+.15,.2,0xffffff,0,k*1.5,k*.95,g);return g}
const TIERN=[16,14,12,10,8,5,3]; // 68 eggs in the arena, tier rises with distance from the gate
const pts=[];
const ER=AR-4;
for(let n=0;pts.length<68&&n<60000;n++){const x=ACX-ER+Math.random()*2*ER,rz=Math.sqrt(Math.max(0,ER*ER-(x-ACX)**2)),z=(Math.random()*2-1)*rz;
 if(pts.every(q=>Math.hypot(q.x-x,q.z-z)>4.2))pts.push({x,z})}
pts.sort((a,b)=>a.x-b.x);
const slots=pts.map((q,i)=>{let t=0,c=i;while(c>=TIERN[t]){c-=TIERN[t];t++}
 const m=makeEgg(t);m.position.set(q.x,0,q.z);scene.add(m);return{t,x:q.x,z:q.z,m,alive:true,timer:0}});
const LOOK={Peasant:{tunic:0x8a6a3a,hair:0x5a3a1a},Slave:{tunic:0x9a9488,hair:0x333333},Soldier:{legion:1},
Gladiator:{tunic:0xc9a060,helmet:1},'Tax Collector':{tunic:0x4a7a4a,hair:0x333333},Celt:{tunic:0x3a6a8a,hair:0xd07a2a},
'Lion Tamer':{tunic:0xc2364a,hair:0x222222,helmet:1},Governor:{tunic:0xf4f0e6,hair:0x777777,toga:1},
'Julius Caesar':{tunic:0xf4f0e6,hair:0x888888,toga:1,sc:1.15},'Emperor Nero':{tunic:0xb8921e,hair:0x5a3a1a,toga:1,sc:1.15},
Boudicca:{tunic:0x8a2a2a,hair:0xc2501a},Prasutagus:{tunic:0x3a5a3a,hair:0xaaaaaa},
Jupiter:{tunic:0xf4f0e6,hair:0xeeeeee,toga:1,sc:1.5},Juno:{tunic:0x6b8ad9,hair:0x222222,sc:1.4}};
const walkers=[];
function addWalker(name){const lk=LOOK[name]||{tunic:0x888888},m=person(Object.assign({skin:0xf0c8a0},lk));m.scale.setScalar(lk.sc||1);
 const tag=label(name,0,0,0);tag.scale.set(4,1,1);
 const w={m,tag,x:-24+(Math.random()-.5)*10,z:-4+(Math.random()-.5)*3,tx:0,tz:0,wait:Math.random()*2,h:2.9*(lk.sc||1)+.8};
 m.position.set(w.x,1,w.z);walkers.push(w);return w}
const baseEggs=[],BSLOT=[...Array(6)].map((_,i)=>({x:-30+i*2.4,z:3.5}));
function putBaseEgg(t,q){const m=makeEgg(t);m.position.set(q.x,0,q.z);scene.add(m);baseEggs.push({t,m,q})}
(st.base||[]).forEach(b=>{if(BSLOT[b.i])putBaseEgg(b.t,BSLOT[b.i])});
if(!st.kept)st.kept=[];st.kept.slice(-14).forEach(addWalker);

// ---------- state ----------
const p={x:-22,z:6,carry:null,mesh:null};
const so={x:ACX,z:0,tx:ACX,tz:0,cool:0,swing:0};
const joy={x:0,y:0},keys={};
let toastT;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}
function hud(){$('money').textContent='$'+st.money;$('speed').textContent='Speed '+Math.floor(st.speed)}

// input
const stick=$('stick'),thumb=$('thumb'),baseEl=$('base');let sid=null,cx0=0,cy0=0;
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);const r=baseEl.getBoundingClientRect();cx0=r.left+48;cy0=r.top+48;mv(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)mv(e)});
const endj=e=>{if(e.pointerId===sid){sid=null;joy.x=joy.y=0;thumb.style.transform=''}};
stick.addEventListener('pointerup',endj);stick.addEventListener('pointercancel',endj);
function mv(e){let dx=e.clientX-cx0,dy=e.clientY-cy0;const l=Math.hypot(dx,dy),R=48;if(l>R){dx*=R/l;dy*=R/l}joy.x=dx/R;joy.y=dy/R;thumb.style.transform=`translate(${dx}px,${dy}px)`}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const jump=()=>{if(py===0&&!p.fling)pvy=10};
$('jump').addEventListener('pointerdown',e=>{e.stopPropagation();jump()});
$('zin').onclick=()=>setZ(Z-.2);$('zout').onclick=()=>setZ(Z+.2);
addEventListener('wheel',e=>setZ(Z+Math.sign(e.deltaY)*.1),{passive:true});
let pd=0;
addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)setZ(Z*pd/d);pd=d}},{passive:true});
addEventListener('touchend',()=>pd=0);
addEventListener('keydown',e=>{if(e.key===' ')jump();if(e.key==='+'||e.key==='=')setZ(Z-.2);if(e.key==='-')setZ(Z+.2)});
$('rotOk').onclick=()=>$('rotate').classList.remove('on');
function lock(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}

// dialogs
const dlg=$('dlg');
function show(h){$('dlgBody').innerHTML=h;dlg.showModal()}
const PORT={};
function portrait(r){if(PORT[r[0]])return PORT[r[0]];const lk=LOOK[r[0]]||{},c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d'),F=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h)},hx=n=>'#'+n.toString(16).padStart(6,'0');
 F(CSS[r[1]],0,0,16,16);F('rgba(255,255,255,.25)',0,0,16,7);
 F(hx(lk.tunic||0x888888),2,11,12,5);
 if(lk.toga){F('#f4f0e6',2,11,12,5);F('#6b2b8a',9,11,1,5);F('#b8921e',2,14,12,1)}
 if(lk.legion){F('#b8bcc4',2,11,12,1);F('#b8bcc4',2,13,12,1);F('#b02a2a',2,15,12,1);F('#b8bcc4',1,11,2,2);F('#b8bcc4',13,11,2,2)}
 F('#f0c8a0',5,4,6,7);
 if(lk.hair){F(hx(lk.hair),4,3,8,2);F(hx(lk.hair),4,4,1,5);F(hx(lk.hair),11,4,1,5)}
 if(lk.toga&&!lk.legion)F('#4caf50',4,3,8,1);
 if(lk.helmet){F('#b88a2a',4,2,8,3);F('#c2364a',7,0,2,2)}
 if(lk.legion){F('#b8bcc4',4,2,8,3);F('#b8bcc4',4,5,1,4);F('#b8bcc4',11,5,1,4);F('#c2364a',3,0,10,2)}
 F('#222',6,7,1,1);F('#222',9,7,1,1);F('#a05a4a',7,9,2,1);
 return PORT[r[0]]=c.toDataURL()}
$('facts').onclick=()=>{show('<h3>Facts</h3>'+ROMANS.map(r=>{const f=st.found[r[0]];return `<div class="row"><img class="pt" src="${portrait(r)}" style="border-color:${CSS[r[1]]};${f?'':'filter:brightness(0) opacity(.4)'}"><div style="flex:1"><b>${f?r[0]:'???'}</b><div class="fact">${f?r[2]:'Hatch this Roman to unlock their fact.'}</div></div><span class="tag" style="background:${CSS[r[1]]}">${RAR[r[1]]}</span></div>`}).join('')+'<div class="acts"><button class="btn" id="x">Close</button></div>');$('x').onclick=()=>dlg.close()};
let nearEgg=null;
const _v=new THREE.Vector3();
function edge(w,el,t){_v.copy(w).project(camera);const out=_v.x>.8||_v.x<-.8;el.style.display=out&&((_v.x>0)===(el.id==='edgeR'))?'block':'none';el.textContent=t;el.style.top=Math.max(50,Math.min(75,(1-_v.y)*50))+'%'}
let hatching=null;
$('open').onclick=()=>{if(!nearEgg||hatching)return;hatching={e:nearEgg,t:1.3};$('open').style.display='none';toast('Hatching...')};
function hatch(e){hatching=null;const pool=ROMANS.filter(r=>r[1]===e.t),r=pool[Math.floor(Math.random()*pool.length)],price=PRICE[e.t]*5;
 st.found[r[0]]=1;
 show(`<img class="pt" src="${portrait(r)}" style="border-color:${CSS[r[1]]};float:right"><h3>You hatched: ${r[0]}</h3><span class="tag" style="background:${CSS[r[1]]}">${RAR[r[1]]}</span><p>${r[2]}</p><div class="acts"><button class="btn" id="keep">Keep</button><button class="btn" id="sell">Sell $${price}</button></div>`);
 const done=()=>{e.m.rotation.z=0;scene.remove(e.m);baseEggs.splice(baseEggs.indexOf(e),1);nearEgg=null;$('open').style.display='none';dlg.close();hud()};
 $('keep').onclick=()=>{st.kept.push(r[0]);addWalker(r[0]);toast(r[0]+' is now walking around your base');done()};
 $('sell').onclick=()=>{st.money+=price;toast('Sold for $'+price);done()}}

// ---------- loop ----------
const WALK=7,TREAD_RATE=6;
let Z=Math.max(.45,Math.min(1.8,st.zoom||1)),pvy=0,py=0;
const setZ=z=>{Z=Math.max(.45,Math.min(1.8,z));st.zoom=Z};
let lastF=Math.floor(st.speed),beltPos=0,gainTotal=0,gainIdle=0,lastEggs=-1,dust=[];
for(let i=0;i<10;i++){const d=box(.35,.35,.35,0xe8dfc8,0,-5,0);dust.push({m:d,t:0})}
function setLimbs(u,ph,amp,armAmp){u.l.rotation.x=Math.sin(ph)*amp;u.r.rotation.x=-Math.sin(ph)*amp;u.al.rotation.x=-Math.sin(ph)*armAmp;u.ar.rotation.x=Math.sin(ph)*armAmp}
function update(dt){
 const now=performance.now();
 if(hatching){hatching.t-=dt;hatching.e.m.rotation.z=Math.sin(now/45)*.3*(1+(1.3-hatching.t));if(hatching.t<=0){hatching.e.m.rotation.z=0;hatch(hatching.e)}}
 let l=0,ix=0,iz=0,onTread=false;
 if(p.fling){const f=p.fling;f.t+=dt;const u=Math.min(1,f.t/1.3);
  p.x=f.x0+(f.x1-f.x0)*u;p.z=f.z0+(f.z1-f.z0)*u;
  player.position.set(p.x,Math.sin(u*Math.PI)*9,p.z);player.rotation.x=-u*Math.PI*6;setLimbs(player.userData,now/60,1.2,2.4);
  if(u>=1){p.fling=null;player.rotation.x=0;toast('Flung back to your base! Get speed, then try a lighter egg.')}
 }else{
  ix=joy.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  iz=joy.y+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}
  const mul=p.carry?Math.max(.2,Math.min(1,st.speed/req(p.carry.t))):1;
  const v=WALK*mul;
  p.x=Math.max(-36,Math.min(ACX+AR+4,p.x+ix*v*dt));p.z=Math.max(-AR-4,Math.min(AR+4,p.z+iz*v*dt));
  for(const w of walls){const dx=p.x-w.x,dz=p.z-w.z,d=Math.hypot(dx,dz);if(d<2.9){p.x=w.x+dx/d*2.9;p.z=w.z+dz/d*2.9}}
  if(py>0||pvy>0){pvy-=26*dt;py=Math.max(0,py+pvy*dt);if(py===0)pvy=0}
  onTread=!p.carry&&py<.05&&Math.abs(p.x-TX)<1.4&&Math.abs(p.z-TZ)<2.1;
  if(l>.1)player.rotation.y=Math.atan2(ix,iz);else if(onTread)player.rotation.y=Math.PI;
  player.rotation.x=onTread?.3:0;
  if(onTread)setLimbs(player.userData,now/55,1.1,1.1);
  else setLimbs(player.userData,now/80,.7*l,.7*l);
  player.position.set(p.x,py+(onTread?Math.abs(Math.sin(now/55))*.15:0),p.z);
 }
 // kept Romans wander the temple
 for(const w of walkers){const dx=w.tx-w.x,dz=w.tz-w.z,d=Math.hypot(dx,dz);
  if(w.wait>0){w.wait-=dt;setLimbs(w.m.userData,0,0,0)}
  else if(d<.3){w.wait=1+Math.random()*3;w.tx=-24+(Math.random()-.5)*13;w.tz=-4+(Math.random()-.5)*4.4}
  else{w.x+=dx/d*1.4*dt;w.z+=dz/d*1.4*dt;w.m.rotation.y=Math.atan2(dx,dz);setLimbs(w.m.userData,now/160,.6,.6)}
  w.m.position.set(w.x,1,w.z);w.tag.position.set(w.x,1+w.h,w.z)}
 // treadmill + speed feedback
 beltPos+=(onTread?7:.8)*dt;belt.forEach((b,i)=>b.position.z=TZ-1.6+((i*.8+beltPos)%4));
 if(onTread){const g=TREAD_RATE*dt;st.speed+=g;gainTotal+=g;gainIdle=0;
  const f=Math.floor(st.speed);for(let k=lastF+1;k<=f;k++){pop('+1');if(k%10===0)pop('+10!',true)}lastF=f;
  dust.forEach(d=>{if(d.t<=0&&Math.random()<.15){d.t=.5;d.m.position.set(p.x+(Math.random()-.5)*1.4,.3,p.z+1.2)}});hud()}
 else if(gainTotal>0){lastF=Math.floor(st.speed);gainIdle+=dt;if(gainIdle>2.5)gainTotal=0}
 dust.forEach(d=>{if(d.t>0){d.t-=dt;d.m.position.z+=dt*4;d.m.position.y+=dt*1.5;d.m.scale.setScalar(Math.max(.01,d.t*2));if(d.t<=0)d.m.position.y=-5}});
 const gE=$('gain');gE.style.display=gainTotal>0?'block':'none';
 if(gainTotal>0)gE.textContent='▲ +'+Math.floor(gainTotal)+' speed ('+(onTread?'+'+TREAD_RATE+'/s':'stopped')+')';
 $('speed').classList.toggle('up',onTread);
 // pickup
 if(!p.carry&&!p.fling)for(const s of slots){if(s.alive&&Math.hypot(p.x-s.x,p.z-s.z)<1.6){s.alive=false;s.m.visible=false;s.timer=8;p.carry=s;
  p.mesh=makeEgg(s.t,true);p.mesh.position.set(0,2.5,0);player.add(p.mesh);
  toast(`${RAR[s.t]} egg. Needs speed ${req(s.t)}, you have ${Math.floor(st.speed)}. Run to your base!`);break}}
 for(const s of slots)if(!s.alive&&s!==p.carry){s.timer-=dt;if(s.timer<=0){s.alive=true;s.m.visible=true}}
 slots.forEach((s,i)=>{if(s.alive)s.m.position.y=Math.abs(Math.sin(now/500+i))*.18});
 const nAlive=slots.reduce((n,s)=>n+(s.alive?1:0),0);if(nAlive!==lastEggs){lastEggs=nAlive;$('eggs').textContent='Eggs '+nAlive+'/68'}
 // deposit
 if(p.carry&&p.x<-9){if(baseEggs.length<6){const b=BSLOT.find(q=>!baseEggs.some(e=>e.q===q));putBaseEgg(p.carry.t,b);
  player.remove(p.mesh);p.carry.alive=false;p.carry.timer=8;p.carry=null;toast('Egg placed in your base. Walk up to it and tap Open egg to hatch it.')}else if(!p.warned){toast('Base is full. Open an egg first.');p.warned=1;setTimeout(()=>p.warned=0,3000)}}
 // soldier
 so.cool-=dt;so.swing=Math.max(0,so.swing-dt);
 const chase=p.carry&&!p.fling&&p.x>ACX-AR&&so.cool<=0;
 if(chase){so.tx=p.x;so.tz=p.z}else if(Math.hypot(so.x-so.tx,so.z-so.tz)<.8){const a=Math.random()*6.28,r=Math.random()*(AR-8);so.tx=ACX+Math.cos(a)*r;so.tz=Math.sin(a)*r}
 const dx=so.tx-so.x,dz=so.tz-so.z,dd=Math.hypot(dx,dz)||1,sv=chase?5.2:2.5;
 so.x+=dx/dd*sv*dt;so.z+=dz/dd*sv*dt;sol.position.set(so.x,0,so.z);sol.rotation.y=Math.atan2(dx,dz);
 solLabel.position.set(so.x,6,so.z);
 setLimbs(sol.userData,now/(chase?90:200),.5,so.swing>0?0:.4);
 if(so.swing>0)sol.userData.ar.rotation.x=-2.4;
 sword.rotation.x=so.swing>0?-1.2:0;
 if(chase&&Math.hypot(p.x-so.x,p.z-so.z)<2.4){so.swing=.5;so.cool=2.5;so.tx=ACX;so.tz=0;
  const s=p.carry;player.remove(p.mesh);p.carry=null;s.timer=4;p.fling={t:0,x0:p.x,z0:p.z,x1:-18,z1:8};toast('The Centurion flung you!')}
 // near egg in base
 nearEgg=null;for(const e of baseEggs)if(Math.hypot(p.x-e.q.x,p.z-e.q.z)<2.4)nearEgg=e;
 $('open').style.display=nearEgg&&!p.carry&&!hatching&&!p.fling?'block':'none';
 // hint
 const h=$('hint');if(p.carry&&p.x>-9){h.textContent='<< Run to your base!';h.style.display='block'}
 else if(!p.carry&&p.x<-4&&!p.fling){h.textContent='Eggs this way >>';h.style.display='block'}else h.style.display='none';
 // camera
 camera.position.lerp(new THREE.Vector3(p.x+12*Z,28*Z,p.z+22*Z),.1);camera.lookAt(camera.position.x,0,camera.position.z-14*Z);
 edge(new THREE.Vector3(ACX,2,0),$('edgeR'),'Colosseum >>');edge(new THREE.Vector3(BX,2,0),$('edgeL'),'<< Your base');
}
let last=performance.now(),started=false;
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000);last=now;if(!dlg.open&&started)update(dt);renderer.render(scene,camera);updateLabels()}
camera.position.set(p.x+12,28,p.z+22);
document.body.addEventListener('pointerdown',lock,{once:true});
hud();requestAnimationFrame(tick);
$('bar').style.animation='none';$('bar').style.width='100%';$('ldg').textContent='Ready!';$('play').style.display='block';
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
if(ios&&!standalone)$('a2hs').style.display='block';
$('play').onclick=()=>{const d=document.documentElement,rf=d.requestFullscreen||d.webkitRequestFullscreen;try{if(rf&&!standalone)Promise.resolve(rf.call(d)).catch(()=>{})}catch(e){}
 lock();$('title').style.display='none';started=true;last=performance.now();
 toast('Stand on the treadmill for speed. Then grab an egg from the Colosseum!')};
</script>
</body>
</html>
